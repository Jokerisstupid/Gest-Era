<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GestEra responsive review</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1d;color:#dce6fa;font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:1;padding:15px 20px;background:#132039;border-bottom:1px solid #3b4d6c}h1{font-size:16px;margin:0 0 7px}p{color:#9eafcb;font-size:12px;margin:0 0 12px}form,.sizes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}form{margin-bottom:10px}input{flex:1;min-width:160px;max-width:620px;padding:9px;background:#0b172a;color:#dce6fa;border:1px solid #4a6086;border-radius:6px}button{padding:9px 13px;background:#233c62;color:#e1eafa;border:1px solid #526d96;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#445a9c;border-color:#b6c4ff}main{overflow:auto;padding:20px;min-height:80vh}iframe{display:block;margin:0 auto;border:0;background:#0d1323;box-shadow:0 0 0 1px #4c6286;width:390px;height:844px;max-width:none}output{font-size:12px;color:#aabfdf}a{color:#bdd0ff}
</style></head><body><header><h1>GestEra responsive review</h1><p>Render the actual app at a fixed CSS viewport. Notes remain in this browser. This review page does not simulate gesture accuracy or device performance.</p><form id="route"><label for="path">App path</label><input id="path" value="/app" aria-label="App path"><button>Load view</button><a href="/app">Back to app</a></form><div class="sizes" role="group" aria-label="Review viewport"><button type="button" data-width="320" data-height="740">Small phone</button><button type="button" data-width="390" data-height="844" aria-pressed="true">Phone</button><button type="button" data-width="820" data-height="1180">Tablet</button><button type="button" data-width="1280" data-height="800">Desktop</button><output id="dimensions" aria-live="polite">390 × 844 CSS px</output></div></header><main><iframe title="App review viewport" src="/app" allow="camera"></iframe></main><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('output').textContent=button.dataset.width+' × '+button.dataset.height+' CSS px';}));document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();try{const url=new URL(document.querySelector('input').value,location.origin);if(url.origin!==location.origin||!['/app','/notebooks','/projects','/favorites','/settings','/onboarding'].includes(url.pathname)&&!url.pathname.startsWith('/board/'))throw Error();frame.src=url.href;}catch{document.querySelector('output').textContent='Use an app path such as /app or /board/page-id';}});
</script></body></html>
